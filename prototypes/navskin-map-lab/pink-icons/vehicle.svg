<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>Carrinho Hello Kitty — vista de cima</title>
  <desc>Carrinho branco com capô em forma de Hello Kitty, laço rosa, nariz amarelo e banco conversível rosa. A frente aponta para cima.</desc>
  <defs>
    <linearGradient id="body" x1="15" y1="16" x2="51" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FFF9FC"/><stop offset="1" stop-color="#E8DFE9"/>
    </linearGradient>
    <linearGradient id="hood" x1="19" y1="6" x2="43" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FFFDFD"/><stop offset="1" stop-color="#F1E8EF"/>
    </linearGradient>
    <linearGradient id="seat" x1="24" y1="42" x2="40" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F675B7"/><stop offset="1" stop-color="#C91F73"/>
    </linearGradient>
    <linearGradient id="bow" x1="39" y1="5" x2="49" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF74B0"/><stop offset="1" stop-color="#E2247A"/>
    </linearGradient>
  </defs>
  <!-- Top-down navigation artwork: +Y is the rear, the nose faces north. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g fill="#433844" stroke="#332B36" stroke-width="1.2">
      <rect x="8.5" y="15" width="7.5" height="13" rx="3"/>
      <rect x="48" y="15" width="7.5" height="13" rx="3"/>
      <rect x="8.5" y="42" width="7.5" height="14" rx="3"/>
      <rect x="48" y="42" width="7.5" height="14" rx="3"/>
    </g>
    <path d="M10.7 18v7m42.6-7v7M10.7 45v8m42.6-8v8" stroke="#746371" stroke-width="1.2"/>
    <path d="M14 18C14 9 50 9 50 18v31c0 7-5 11-18 11S14 56 14 49Z" fill="url(#body)" stroke="#754961" stroke-width="1.7"/>
    <!-- Open pink cockpit, recessed into the white toy body. -->
    <path d="M21 32h22l1 16c0 6-3 8-12 8s-12-2-12-8Z" fill="#B82169" stroke="#9F3B6D" stroke-width="1.2"/>
    <path d="M22 34h20l.5 13h-21Z" fill="#F355A4"/>
    <path d="M22 35v12m20-12v12" stroke="#FF9ACB" stroke-width="1.3"/>
    <path d="M23 43q9-3 18 0v8q-9 5-18 0Z" fill="url(#seat)" stroke="#A82F66" stroke-width="1.2"/>
    <path d="M24 49q8 2 16 0M27 44v4m5-5v6m5-5v4" stroke="#FFB2D7" stroke-width="1"/>
    <path d="M22 52q10 6 20 0" stroke="#F88EBE" stroke-width="1.5"/>
    <path d="M16.8 34v14m30.4-14v14" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- A real open steering wheel helps the silhouette read as a car. -->
    <circle cx="27" cy="37.4" r="3.1" fill="#F8ACD1" stroke="#A72A64" stroke-width="1.4"/>
    <path d="m24.5 36.1 2.5 1.3 2.5-1.3M27 37.4v2.8" stroke="#C63A7E" stroke-width="1.1"/>
    <!-- Sculpted Kitty hood with two ears; no perspective-facing windshield. -->
    <path d="M14 20 14.8 7.2q.2-3.2 3.2-1.8l7.2 4.7q6.8-1.5 13.6 0L46 5.4q3-1.4 3.2 1.8L50 20c1.2 8.5-6 13.2-18 13.2S12.8 28.5 14 20Z" fill="url(#hood)" stroke="#754961" stroke-width="1.7"/>
    <path d="m17.6 9.1 5 3.3-5.7 1.2Z" fill="#FADCEB"/>
    <path d="m46.4 9.1-5 3.3 5.7 1.2Z" fill="#FADCEB"/>
    <path d="M18 17q10-6 20-3" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Large, sparse facial marks stay recognizable at map scale. -->
    <g fill="#332C35">
      <ellipse cx="24.2" cy="23" rx="1.65" ry="2.2"/>
      <ellipse cx="39.8" cy="23" rx="1.65" ry="2.2"/>
    </g>
    <ellipse cx="32" cy="25.6" rx="2.35" ry="1.75" fill="#FFD64B" stroke="#C69A34" stroke-width=".75"/>
    <path d="m14.5 21.2 4.1 1m-4.7 3.1h4.5m-3.3 4 3.7-1.2m30.7-6.9-4.1 1m4.7 3.1h-4.5m3.3 4-3.7-1.2" stroke="#332C35" stroke-width="1.5"/>
    <!-- Oversized hot-pink bow: Kitty's signature, placed on her left ear. -->
    <path d="M43.5 9.9C39.8 4.6 35.8 5.7 36.7 10.4c-2.5 4.3 1.5 7.9 6.7 3.8 5 5.2 9 2.7 7.7-1.9 2.7-4.9-1.6-8.8-7.6-2.4Z" fill="url(#bow)" stroke="#9F2B64" stroke-width="1.3"/>
    <path d="m39.1 9.4 3.2 2.5-3.5 1.1m8-3.3-1.6 2.5 2.8 1.6" stroke="#C62A71" stroke-width="1.1"/>
    <ellipse cx="43.6" cy="12" rx="2.2" ry="2.5" fill="#F9519C" stroke="#A12C65" stroke-width="1.2"/>
    <path d="m38.4 8.4 1.4.5m7.4-1 1.3.2" stroke="#FFC1DE" stroke-width="1.1"/>
    <!-- Pearl rear bumper and tiny raspberry tail lights. -->
    <path d="M20 55.3q12 5 24 0" stroke="#C1A8BA" stroke-width="1.3"/>
    <path d="m18 52 2.5 1.2M46 52l-2.5 1.2" stroke="#EF5199" stroke-width="2.2"/>
  </g>
</svg>
